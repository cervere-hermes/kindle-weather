name: render
on:
  schedule:
    - cron: "7,37 * * * *"   # twice an hour (GitHub may run a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: render
env:
  # Public repo that only holds the rendered images; the Kindle downloads from here.
  ARTIFACTS_REPO: cervere-hermes/kindle-weather-artifacts
  ARTIFACTS_BRANCH: main
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render dashboard
        run: node src/render.mjs
      - name: Convert to 8-bit grayscale for e-ink
        run: |
          for f in dist/weather-*.png; do
            if command -v magick >/dev/null; then magick "$f" -colorspace Gray -depth 8 "$f";
            elif command -v convert >/dev/null; then convert "$f" -colorspace Gray -depth 8 "$f"; fi
          done
      - name: Publish images to the public artifacts repo
        env:
          ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
          DEPLOY_KEY: ${{ secrets.ARTIFACTS_DEPLOY_KEY }}
        run: |
          # Preferred: a fine-grained token with Contents read/write on kindle-weather-artifacts only.
          # Fallback: an SSH deploy key with write access.
          if [ -n "$ARTIFACTS_TOKEN" ]; then
            REMOTE="https://x-access-token:${ARTIFACTS_TOKEN}@github.com/${ARTIFACTS_REPO}.git"
          elif [ -n "$DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/artifacts_key && chmod 600 ~/.ssh/artifacts_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/artifacts_key -o IdentitiesOnly=yes"
            REMOTE="git@github.com:${ARTIFACTS_REPO}.git"
          else
            echo "::error::Add an ARTIFACTS_TOKEN secret (fine-grained token, Contents read/write on ${ARTIFACTS_REPO})"; exit 1
          fi
          mkdir out && cp dist/weather-*.png dist/model.json out/
          printf '# kindle-weather-artifacts\n\nRendered Kindle weather images, replaced every run. Nothing else lives here.\n' > out/README.md
          cd out
          git init -q -b "$ARTIFACTS_BRANCH"
          git config user.name "weatherboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "render $(date -u +%FT%TZ)"
          git push -qf "$REMOTE" "$ARTIFACTS_BRANCH"
