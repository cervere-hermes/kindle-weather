# Where GitHub Actions publishes the images (public repo kindle-weather-artifacts, main branch)
BASE_URL="https://raw.githubusercontent.com/cervere-hermes/kindle-weather-artifacts/main"
# Minutes between refreshes
REFRESH_MIN=30
# 1 = switch Wi-Fi off between refreshes (saves battery), 0 = leave it on
WIFI_SAVER=1
# Force the screen size if auto-detection is wrong (this Kindle: 600x800). Leave empty to auto-detect.
SCREEN=600x800

# --- On-demand refresh (optional) ---
# With a token, a single tap asks GitHub to render a fresh forecast (about 1-2 min).
# Create a fine-grained token: repository access = only kindle-weather,
# permissions = Actions: Read and write (nothing else). Paste it between the quotes.
GH_TOKEN=""
CODE_REPO="cervere-hermes/kindle-weather"
ARTIFACTS_REPO="cervere-hermes/kindle-weather-artifacts"
